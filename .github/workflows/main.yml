on: [push, pull_request]

name: Continuous integration

permissions:
  contents: read

jobs:
  Prepare:
    runs-on: ubuntu-24.04
    outputs:
      nightly_version: ${{ steps.read_toolchain.outputs.nightly_version }}
      msrv_version: ${{ steps.read_msrv.outputs.msrv_version }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
      - name: "Read nightly version"
        id: read_toolchain
        run: |
          set -euo pipefail
          version=$(cat nightly-version)
          echo "nightly_version=$version" >> $GITHUB_OUTPUT
      - name: Read MSRV from clippy.toml
        id: read_msrv
        run: |
          set -euo pipefail
          msrv=$(grep '^msrv *= *"' clippy.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "msrv_version=$msrv" >> "$GITHUB_OUTPUT"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Running cargo fmt
        run: cargo fmt --all -- --check

  symbol_versions:
    name: Symbol Version Prefixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Check simplicity-sys symbol prefixes match its version
        run: ./simplicity-sys/check-symbol-versions.sh

  vendored_libsimplicity:
    name: Vendored libsimplicity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Check generated jets come from the vendored revision
        run: ./update_jets.sh --check
      - name: Read vendored libsimplicity revision
        id: libsimplicity
        run: |
          set -euo pipefail
          echo "rev=$(sed -n '2p' simplicity-sys/depend/simplicity-HEAD-revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout libsimplicity
        uses: actions/checkout@v4
        with:
          repository: BlockstreamResearch/simplicity
          ref: ${{ steps.libsimplicity.outputs.rev }}
          path: libsimplicity
      - name: Re-vendor libsimplicity and check for differences
        env:
          LIBSIMPLICITY_REV: ${{ steps.libsimplicity.outputs.rev }}
        run: |
          set -euo pipefail
          cd simplicity-sys
          # vendor-simplicity.sh asks before deleting the existing vendored copy.
          echo y | ./vendor-simplicity.sh depend ../libsimplicity
          if [ -n "$(git status --porcelain --untracked-files=all -- .)" ]; then
            echo "simplicity-sys does not match libsimplicity $LIBSIMPLICITY_REV re-vendored with vendor-simplicity.sh:"
            git status --short --untracked-files=all -- .
            git diff --stat -- .
            exit 1
          fi

  simpcli_test:
    name: SimpCLI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Running cargo test
        run: |
          cd simpcli
          cargo test

  bench_test:
    name: Jets-Bench Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Running cargo test
        run: |
          cargo install cargo-criterion
          cd jets-bench
          cargo test
          cargo criterion --no-run

  test:
    name: Tests
    needs: Prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - ${{ needs.Prepare.outputs.nightly_version }}
          - ${{ needs.Prepare.outputs.msrv_version }}
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Set dependencies
        run: cp Cargo-recent.lock Cargo.lock
      - name: Running cargo test
        env:
          FEATURES: base64 elements test-utils serde human_encoding
        run: |
          for f in $FEATURES; do echo "Features: $f" && cargo test --locked --no-default-features --features="$f"; done
          echo "All features" && cargo test --locked --all-features
          cd simplicity-sys
          cargo test --locked --no-default-features
          cargo test --locked --features="test-utils"
          echo "No default features" && cargo test --locked --no-default-features
          echo "All features" && cargo test --locked --all-features

  feature_matrix:
    name: Feature Matrix (cargo hack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - name: Set dependencies
        run: cp Cargo-recent.lock Cargo.lock
      - name: Running cargo hack over the feature powerset
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo hack check --locked --workspace --exclude simplicity-fuzz \
            --all-targets --feature-powerset

  ignored:
    name: Ignored Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Running cargo test
        run: cargo test -- --ignored

  clippy:
    name: Clippy
    needs: Prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.Prepare.outputs.nightly_version }}
          components: clippy
      - name: Running cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings

  test-other-platforms:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set dependencies
        run: cp Cargo-recent.lock Cargo.lock
      - name: Run unit tests
        run: |
          cargo test --locked --manifest-path simplicity-sys/Cargo.toml
          cargo test --locked --workspace --all-features

  docs:
    name: Docs
    needs: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v4
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.Prepare.outputs.nightly_version }}
      - name: Check that documentation builds without errors
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings -D rustdoc::broken-intra-doc-links"
        run: cargo doc --no-deps -j1 --all-features
